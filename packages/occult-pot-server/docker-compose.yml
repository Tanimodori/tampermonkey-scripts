# The published port is scanned, so each container's stdout is bounded at 50 MB. The app keeps its
# own rotating file under ./logs as well.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# The value files every service that needs values reads, least specific first: a later file overrides
# an earlier one, and a service's own `environment:` overrides all of them.
#
#   .env.production   .env   .env.local   .env.production.local
#
# `format: raw` because a document id carries a `$`. `.env` is the deployment's own base file: the
# delivered list is beneath it, and the `.local` files above it, so a machine or deployment override
# still wins.
x-env-files: &env-files
  - path: .env.production
    required: false
    format: raw
  - path: .env
    required: false
    format: raw
  - path: .env.local
    required: false
    format: raw
  - path: .env.production.local
    required: false
    format: raw

services:
  nginx:
    # 1.30 is the current stable line and above 1.27.3, where `resolve` in an upstream became open
    # source; bump it as stable moves.
    image: nginx:1.30-alpine
    depends_on:
      occult-pot-server:
        condition: service_healthy
    ports:
      # The only port reachable from the internet; the value comes from compose interpolation
      # (`--env-file`, the shell or a `.env` beside this file).
      - '${OPS_COMPOSE_NGINX_PORT:-29070}:80'
    environment:
      # The zone nginx logs in. Empty falls back to the app's `OPS_SERVER_LOG_TIMEZONE` — which only
      # reaches this interpolation through the shell or `--env-file` — and then to UTC.
      TZ: ${OPS_COMPOSE_NGINX_TZ:-${OPS_SERVER_LOG_TIMEZONE:-UTC}}
    volumes:
      # The repository is the single source of the proxy's configuration.
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared with the app: nginx writes the access log fail2ban reads there.
      - ./logs:/var/log/occult-pot-server
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  occult-pot-server:
    build:
      # The rush deploy output, so the build needs no sources, package manager or network.
      context: ./deploy
      dockerfile: Dockerfile
    image: occult-pot-server:latest
    depends_on:
      redis:
        condition: service_healthy
    # The shared value files; the values that follow from the topology are pinned below.
    env_file: *env-files
    environment:
      # The internal port nginx proxies to, and the one the image's healthcheck asks.
      OPS_SERVER_PORT: 3000
      # Exactly one proxy hop: the client IP then comes from nginx's X-Forwarded-For entry, which is
      # what the per-IP limits count. This port is never published.
      OPS_SERVER_TRUST_PROXY: 1
      # The state store, by service name. The password arrives as `OPS_SERVER_REDIS_PASSWORD`, the
      # variable Redis itself reads.
      OPS_SERVER_REDIS_URL: redis://redis:6379
    volumes:
      # Where the rotating file sink writes: uid 1000 — the runtime `node` user — has to be able to
      # write here (`chown 1000:1000 logs` once on a native Linux host).
      - ./logs:/var/log/occult-pot-server
    # No published port: reachable as occult-pot-server:3000 on this network only.
    networks: [occult-pot]
    restart: unless-stopped
    # Time for the graceful shutdown to flush the write queue and the log sinks.
    stop_grace_period: 30s
    init: true
    logging: *logging

  redis:
    image: redis:7-alpine
    # Read for `OPS_SERVER_REDIS_PASSWORD`, the one value this service wants.
    env_file: *env-files
    # AOF on, and the password from the same variable the app uses: neither side can disagree, and
    # leaving it empty means no authentication at all.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes $${OPS_SERVER_REDIS_PASSWORD:+--requirepass "$$OPS_SERVER_REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    # Not published, so a host Redis on 6379 cannot collide with it.
    networks: [occult-pot]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${OPS_SERVER_REDIS_PASSWORD:+-a "$$OPS_SERVER_REDIS_PASSWORD"} --no-auth-warning ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # The monitoring group, started with `docker compose --profile stats up -d`. Only Prometheus and
  # Grafana publish ports, both on 127.0.0.1 for an SSH tunnel; the exporters publish none.

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [stats]
    ports:
      # Loopback only: Prometheus has no authentication of its own.
      - '127.0.0.1:${OPS_COMPOSE_PROMETHEUS_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      # Scrape interval, targets and the 60-day / 5 GB retention all live in this one file.
      - ./deploy/stats/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [stats]
    ports:
      - '127.0.0.1:${OPS_COMPOSE_GRAFANA_PORT:-9999}:9999'
    # Read for `GF_SECURITY_ADMIN_PASSWORD`, which the deployment keeps in one of the value files.
    env_file: *env-files
    environment:
      # 9999 in the container, on the host and in the tunnel alike: 3000 is the app's.
      GF_SERVER_HTTP_PORT: '9999'
      # The address the browser uses, which is the tunnel's; Grafana builds its links from it.
      GF_SERVER_ROOT_URL: http://127.0.0.1:${OPS_COMPOSE_GRAFANA_PORT:-9999}/
      # Reached through a tunnel with an admin account, so neither of these has a place here.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Without this, Grafana 13 updates the bundled Prometheus data source at start-up and can leave
      # it unregistered (observed on 13.2.2: the running plugin is killed, `plugin.notRegistered`
      # afterwards). The instance needs no plugin it does not ship with, so nothing is preinstalled
      # or updated from grafana.com either.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    entrypoint:
      # Without a password Grafana would quietly keep `admin`/`admin`; refuse to start instead.
      - /bin/sh
      - -c
      - |
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" || {
          echo "GF_SECURITY_ADMIN_PASSWORD is required: set it in .env.production.local" >&2
          exit 1
        }
        exec /run.sh
    volumes:
      # Data source and dashboard are files in the repository, not clicks in an admin UI.
      - ./deploy/stats/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/stats/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  redis-exporter:
    # The `-alpine` variant: the exporter image proper has no shell, and the command below needs one.
    image: oliver006/redis_exporter:v1.91.1-alpine
    profiles: [stats]
    # Read for `OPS_SERVER_REDIS_PASSWORD`, the same one Redis was configured with.
    env_file: *env-files
    environment:
      REDIS_ADDR: redis://redis:6379
    # The image's entrypoint is the exporter binary, so a `command:` would be swallowed as its
    # arguments; this is what makes the `sh -c` below real.
    entrypoint: ['/bin/sh', '-c']
    # The exporter takes the password as a flag or as `REDIS_PASSWORD`, and only the flag can be fed
    # from the shared value files.
    command:
      - exec /redis_exporter --redis.addr="$$REDIS_ADDR" $${OPS_SERVER_REDIS_PASSWORD:+--redis.password="$$OPS_SERVER_REDIS_PASSWORD"}
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    profiles: [stats]
    # The internal `stub_status` listener deploy/nginx/default.conf adds; it is not published.
    command: ['--nginx.scrape-uri=http://nginx:8080/stub_status']
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [stats]
    # Host metrics, read through the mount below and scraped from inside this network — so no host
    # networking and no published port.
    #
    # Read-only and without `rslave` on purpose: propagating mounts is unavailable in some
    # environments (WSL among them) and only helps for filesystems mounted later.
    command: ['--path.rootfs=/host']
    volumes:
      - '/:/host:ro'
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

networks:
  # A user-defined bridge: containers reach each other by service name. It must not be
  # `internal: true`, the app needs outbound internet for docs.qq.com.
  occult-pot:
    name: occult-pot

volumes:
  redis-data:
  # Monitoring data, on named volumes: nothing on the host reads them.
  prometheus-data:
  grafana-data:
