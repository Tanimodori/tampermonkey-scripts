# fail2ban filter for the nginx access log this deployment writes into the repository's `logs/`
# (see `deploy/nginx/default.conf`).
#
# One JSON line per request. In that line `status` sits *before* `uri` on purpose: `escape=json`
# escapes a quote inside a URI as `\"`, so an expression that had to read through the URI to reach the
# status would stop at the escape — and the requests worth banning are exactly the ones carrying
# quotes. Everything before `status` (an address, a method, a request id) is quote-free.
#
# Install:
#   sudo cp deploy/fail2ban/filter.d/occult-pot-nginx.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/occult-pot-nginx.local     /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
# Then check it against the log it will read:
#   sudo fail2ban-regex /home/ubuntu/tampermonkey-scripts/packages/occult-pot-server/logs/nginx-access.log occult-pot-nginx

[Definition]

# Quoting is doubled because these values are read as Python config: a lone `%` would start an
# interpolation. `\{"time":"…"` is where nginx puts `$time_iso8601`, an ISO 8601 instant with offset.
datepattern = ^\{"time":"%%Y-%%M-%%DT%%H:%%M:%%S

# A refusal, an ordinary miss, or a rate-limited flood. 400 covers the malformed requests scanning
# tools send before they settle on a path; 403 and 429 are nginx's own refusals.
failregex = ^\{"time":"[^"]*","requestId":"[^"]*","remoteAddr":"<HOST>","method":"[A-Z]+","status":(?:400|403|404|429)\b

ignoreregex =
