# The service's only published surface: a reverse proxy in front of occult-pot-server.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by docker-compose.yml — this file is the single
# source of the proxy's configuration, and `docker compose exec nginx nginx -s reload` applies edits.
#
# This image does not run envsubst over this file (it only renders /etc/nginx/templates/*.template),
# so nothing here may assume `${…}`: every value is literal.

# Docker's embedded DNS. Containers on a user-defined network resolve service names through it, and
# 127.0.0.11 is its documented address (there is no IPv6 equivalent, hence ipv6=off).
resolver 127.0.0.11 valid=10s ipv6=off;

# Recreating the app gives it a new address under the same name, and re-looking it up is the proxy's
# job: `resolve` (open source since nginx 1.27.3) does that without a reload, and needs a shared
# memory zone. `keepalive` reuses idle connections to the app instead of opening one per request;
# HTTP/1.1 plus a cleared Connection header are what that needs, and both are stated explicitly even
# though 1.29+ already defaults to them.
upstream occult_pot {
    zone occult_pot 64k;
    server occult-pot-server:3000 resolve;
    keepalive 16;
}

# Two per-IP request-rate shields, both deliberately looser than the app's own Redis-backed limiters
# (120 requests/min general, 20/min writes) so the app stays the effective limit and this layer only
# stops floods. The write zone keys on an empty string for every other method, and requests with an
# empty key are not accounted for.
map $request_method $occult_pot_write_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=occult_pot_general:10m rate=20r/s;
limit_req_zone $occult_pot_write_key zone=occult_pot_writes:10m rate=2r/s;
limit_req_status 429;

# One line per request on stdout (the image symlinks access.log to /dev/stdout), JSON like the
# service's own lines and carrying the same request id the app logs.
log_format occult_pot escape=json '{"time":"$time_iso8601","requestId":"$request_id","remoteAddr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"upstreamTime":"$upstream_response_time","limitReq":"$limit_req_status"}';

server {
    listen 80;
    server_name _;

    # No version banner. CORS and the security headers belong to the app (cors + helmet); a second
    # copy here would duplicate them.
    server_tokens off;

    access_log /var/log/nginx/access.log occult_pot;

    # A backstop only: the app answers bodies over OPS_SERVER_JSON_BODY_LIMIT (64kb) with its own
    # ERR_PAYLOAD_TOO_LARGE envelope, so this stays well above that and just bounds what nginx
    # buffers. TLS is terminated in front of this container, hence nothing about https here.
    client_max_body_size 1m;

    # gzip_min_length is judged from Content-Length, and gzip_proxied keys off a `Via` request header
    # (which this chain never sends): `any` just removes that dependency. These responses carry no
    # secrets or cookies, so compressing them is not a BREACH concern.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    location / {
        proxy_pass http://occult_pot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appended, not replaced: with OPS_SERVER_TRUST_PROXY=1 the app reads from the right, so the
        # entry this proxy adds is the real client and a client-supplied header is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwritten (the app otherwise reuses a client-supplied id): nginx and app logs then carry
        # one id per request, and `$request_id` matches the app's accepted X-Request-Id shape.
        proxy_set_header X-Request-Id $request_id;

        # The app bounds and paces its own upstream calls (10s timeout, 2 retries, 10 per 3s), so a
        # write can legitimately take seconds: the defaults are fine, stated explicitly.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=occult_pot_general burst=40 nodelay;
        limit_req zone=occult_pot_writes burst=5 nodelay;

        # Only refusals nginx generates itself are re-answered (proxy_intercept_errors stays off, so
        # the app's own 429 keeps its body and its RateLimit-* headers): one failure shape for clients.
        error_page 429 = @rate_limited;
    }

    location @rate_limited {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"code":"ERR_RATE_LIMITED","data":null,"message":"Too many requests from this IP, please retry later","requestId":"$request_id"}';
    }
}
