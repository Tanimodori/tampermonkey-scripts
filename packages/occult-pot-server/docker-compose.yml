# Docker's own log files have no size bound by default, and this port is scanned: keep the last
# 50 MB of each container's stdout/stderr. (The app also writes its own rotating file to ./logs.)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  nginx:
    # The only published surface. 1.30 is the current stable line (1.30.4) and is above 1.27.3, which
    # is where `resolve` in an upstream became open source; bump this line as stable moves, the way
    # `redis:7-alpine` is pinned.
    image: nginx:1.30-alpine
    depends_on:
      occult-pot-server:
        # The proxy resolves the app's name when it starts: wait until the app is actually serving.
        condition: service_healthy
    ports:
      # The only host port this project takes. Override it from the shell or the project-directory
      # `.env` (`OPS_NGINX_PORT=9000 docker compose up -d`); a value in `.env.production*` does NOT
      # feed this interpolation — env_file only reaches the containers.
      - '${OPS_NGINX_PORT:-29070}:80'
    environment:
      # The zone nginx renders `$time_iso8601` in, so its access lines and the app's lines agree. The
      # value is interpolated by compose, so it comes from the shell or `--env-file` (the same way
      # `OPS_NGINX_PORT` does); the app reads the same variable name from its own env files.
      TZ: ${OPS_SERVER_LOG_TIMEZONE:-UTC}
    volumes:
      # One config source, read-only. The image's entrypoint copes with that: its IPv6 step skips a
      # file it cannot write, and its envsubst step only renders /etc/nginx/templates.
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # The same host directory the app writes its rotating file into: nginx adds the access log
      # fail2ban reads (deploy/fail2ban/), while `docker compose logs nginx` keeps reading stdout
      # through the image's own /var/log/nginx/access.log -> /dev/stdout symlink.
      - ./logs:/var/log/occult-pot-server
    networks: [occult-pot]
    restart: unless-stopped
    logging: *logging

  occult-pot-server:
    build:
      # The image only installs the artifact "rush deploy" wrote here (see deploy/README.md): the
      # context is that folder instead of the monorepo, so no sources, no package manager and no
      # apt/npm mirrors are involved.
      context: ./deploy
      dockerfile: Dockerfile
    image: occult-pot-server:latest
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      # Least specific first: files are evaluated in order, and a later one overrides an earlier one.
      # The order is the one the app's own loader uses on the host, so a value lands the same way
      # either side:
      #   .env.production         the tracked production template — part of the delivery
      #   .env.local              this machine's own shared values, ignored
      #   .env.production.local   the deployment's values, ignored; wins over everything above
      #
      # `.env` is deliberately not here: it is the variable reference (all of it commented out), and a
      # documentation file has no business being a source of values. What it documents about these
      # three applies: values go in the files, and only the ignored ones hold secrets.
      #
      # `format: raw` on every one of them: without it compose interpolates `$` in the values, which
      # would eat the `$` of a document id (`300000000$…`). Raw passes each value through as written —
      # the same reading the app's own loader gives the file on the host — so the id is spelled
      # normally here. The trade is that these files must not rely on dotenv sugar: an inline ` # …`
      # after a value would become part of it, and surrounding quotes would be kept.
      - path: .env.production
        required: false
        format: raw
      - path: .env.local
        required: false
        format: raw
      - path: .env.production.local
        required: false
        format: raw
    environment:
      # Topology-following values, pinned here: `environment:` outranks every env_file entry.
      #
      # The internal port nginx proxies to (and the image's healthcheck uses).
      OPS_SERVER_PORT: 3000
      # Exactly one reverse proxy hop. Express then takes the client IP from the right-most
      # X-Forwarded-For entry nginx appended, so per-IP throttling stays correct and a client-supplied
      # header is ignored. This port is not published, so nothing outside the host can reach the app
      # directly. (On Linux the host itself can still reach a container by its bridge IP — that is
      # bridge networking, not a hole here.) If it is ever published directly again, set this back to
      # false.
      OPS_SERVER_TRUST_PROXY: 1
      # The state store is the `redis` service below, by service name on this network. The address
      # carries no credential and no compose variable: the password, when there is one, arrives as
      # `OPS_SERVER_REDIS_PASSWORD` from the env files above — one value, read by both this service
      # and Redis itself, never written into this file or into a URL that could reach a log line.
      OPS_SERVER_REDIS_URL: redis://redis:6379
    volumes:
      # Where the rotating file sink writes (OPS_LOG_ROTATING_FILE_PATH); the bind mount keeps the JSON
      # Lines files on the host. uid 1000 — the runtime `node` user — must be able to write here: on
      # WSL/DrvFs it can, on a native Linux host `chown 1000:1000 logs` once. The image creates the
      # directory as well, so swapping this for a named volume inherits the right ownership.
      - ./logs:/var/log/occult-pot-server
    # No `ports`: internal only, reachable as occult-pot-server:3000 from this network.
    networks: [occult-pot]
    restart: unless-stopped
    # Give the graceful shutdown path time to flush the write queue and the log sinks.
    stop_grace_period: 30s
    init: true
    logging: *logging

  redis:
    image: redis:7-alpine
    env_file:
      # The same files the app reads, because `OPS_SERVER_REDIS_PASSWORD` is the one value this service
      # wants from them. `${VAR:+…}` leaves the flag out when the variable is empty, so a deployment
      # that sets no password gets an unauthenticated Redis — which is exactly what the app then
      # connects to. Both sides read one variable, so they cannot disagree.
      - path: .env.production
        required: false
        format: raw
      - path: .env.local
        required: false
        format: raw
      - path: .env.production.local
        required: false
        format: raw
    # Append-only persistence: the pot list, the pending writes and the credential survive a restart.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes $${OPS_SERVER_REDIS_PASSWORD:+--requirepass "$$OPS_SERVER_REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    # No `ports` either: nothing outside this network (or on another one) can reach Redis, so a host
    # Redis on 6379 cannot collide with it.
    networks: [occult-pot]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${OPS_SERVER_REDIS_PASSWORD:+-a "$$OPS_SERVER_REDIS_PASSWORD"} --no-auth-warning ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

networks:
  # One user-defined bridge for all three: on a custom network containers reach each other by service
  # name, and an explicit `name:` is used as-is instead of being scoped with the project name. It must
  # NOT be `internal: true` — the app needs outbound internet for docs.qq.com.
  occult-pot:
    name: occult-pot

volumes:
  redis-data:
