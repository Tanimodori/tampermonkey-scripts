# fail2ban filter for the nginx access log this deployment writes into the repository's `logs/`
# (see `deploy/nginx/default.conf`).
#
# One JSON line per request. In that line `status` sits *before* `uri` on purpose: `escape=json`
# escapes a quote inside a URI as `\"`, so an expression that had to read through the URI to reach the
# status would stop at the escape — and the requests worth banning are exactly the ones carrying
# quotes. Everything before `status` (an address, a method, a request id) is quote-free.
#
# Install:
#   sudo cp deploy/fail2ban/filter.d/occult-pot-nginx.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/occult-pot-nginx.local     /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
# Then check it against the log it will read:
#   sudo fail2ban-regex /path/to/occult-pot-server/logs/nginx-access.log occult-pot-nginx

[Definition]

# `%` is doubled because these values are read as Python config: a lone one starts an interpolation.
# The directives are Python's `strptime` ones (`%m`/`%d`, not the C `%M`/`%D`, which fail2ban rejects
# outright), and `%z` is part of it on purpose — the line carries `$time_iso8601` with its offset, and
# a timestamp parsed *without* the offset would be read in the host's zone, which is not the zone the
# logs are written in (UTC by default; the host here is CST). An eight-hour error is enough to put
# every event outside `findtime`, i.e. to disable the jail without saying so.
datepattern = ^\{"time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z

# A refusal, an ordinary miss, or a rate-limited flood. 400 covers the malformed requests scanning
# tools send before they settle on a path; 403 and 429 are nginx's own refusals.
#
# No line-start anchor, and no `{"time":` prefix: fail2ban removes the timestamp it matched above
# before applying this expression, so an anchored pattern can never match (measured: 0 of 31 lines,
# against 17 of 17 refusals for the form below).
#
# Everything between the address and the status is quote-free by construction — that is what the
# field order in `log_format` buys (see `deploy/nginx/default.conf`).
failregex = "remoteAddr":"<HOST>","method":"[A-Z]+","status":(?:400|403|404|429)(?:,|\})

ignoreregex =
